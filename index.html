<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids Learning Games</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Learning Games">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Bungee&family=Fredoka:wght@400;500;600;700&family=Henny+Penny&family=Luckiest+Guy&family=Orbitron:wght@700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, warm, playful; big targets for small hands
   IDEA: a toy box of games; each game is a chunky colored tile
   PICTURE: the game itself fills the screen while playing
   COLOUR and TYPE: sunny cream ground, one bold color per game; Fredoka
   LAYOUT: one column, max 860px; stacks on phones */
:root{color-scheme:light;
  --bg:#FFF8EC;--ink:#2B2340;--muted:#6B6585;--card:#FFFFFF;
  --purple:#7C5CFF;--blue:#3B82F6;--green:#22C55E;--red:#EF4444;--yellow:#FACC15;--orange:#F97316;
  --shadow:0 6px 0 rgba(43,35,64,.12),0 10px 24px rgba(43,35,64,.08)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif}
body{background:transparent}
#tbg{position:fixed;inset:0;z-index:-1;background:var(--bg);transition:background .3s}
.themed #app>h1,.themed #app>h2,.themed #app>.sub,.themed #app>.tip,.themed .target,.themed .topbar>h1{color:var(--ink);background:rgba(255,255,255,.9);border-radius:14px;padding:4px 12px;width:fit-content;max-width:100%;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.themed .target,.themed #app>.tip{margin-inline:auto}
.themed .player.add{background:rgba(255,255,255,.85);border-color:var(--purple)}
.themes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.th{height:104px;border-radius:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;font-size:15px;font-weight:600}
.th .thbg{position:absolute;inset:0}.th .thbg svg{display:block}
.th .te{font-size:38px;position:absolute;z-index:1;top:10px;left:0;right:0;text-align:center}
.th .tn{position:relative;z-index:1;background:#fff;border-radius:999px;padding:2px 10px;color:var(--ink)}
.th.on{outline:5px solid var(--yellow);outline-offset:2px}
body{min-height:100vh;overflow-x:clip}
#app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
h1,h2,.gn,.rt{font-family:var(--tf,'Fredoka'),'Fredoka',system-ui,sans-serif}
h1{font-size:34px;margin:6px 0 4px;font-weight:700;line-height:1.1}
h2{font-size:24px;margin:4px 0 12px;font-weight:600}
.sub{color:var(--muted);font-size:17px;margin:0 0 18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.sync{font-size:14px;box-shadow:none;background:#F1ECFF;min-height:32px;padding:5px 12px}
.sync.ok{background:#DCFCE7;color:#166534}.sync.warn{background:#FEF3C7;color:#92400E}
.btn{background:var(--purple);color:#fff;border-radius:18px;padding:14px 22px;font-size:20px;font-weight:600;box-shadow:0 5px 0 color-mix(in srgb,var(--purple) 70%,#000);transition:transform .08s;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--purple) 70%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.small{padding:9px 14px;font-size:16px;border-radius:14px;min-height:44px}
.btn.danger{background:var(--red);box-shadow:0 5px 0 #B91C1C}
.grid{display:grid;gap:14px}
.players{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.player{background:var(--card);border-radius:24px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .1s}
.player:active{transform:scale(.97)}
.player .av{font-size:62px;line-height:1.1}
.player .nm{font-size:22px;font-weight:600;margin-top:6px}
.player .meta{font-size:15px;color:var(--muted)}
.player.add{border:3px dashed #CFC6F5;background:transparent;box-shadow:none;color:var(--purple)}
.games{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.game{border-radius:24px;padding:16px;text-align:left;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:150px;transition:transform .1s}
.game:active{transform:scale(.97)}
.game .ge{font-size:44px}
.game .gn{font-size:21px;font-weight:700;margin-top:4px;line-height:1.15}
.game .gs{font-size:14px;opacity:.95}
.game .gl{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.28);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600}
.game .nw{position:absolute;top:12px;right:12px;margin-top:30px;background:var(--yellow);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}
.progress{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#E5DFF7}
.dot.done{background:var(--green)}.dot.miss{background:var(--yellow)}.dot.now{background:var(--purple);transform:scale(1.25)}
.qcard{background:var(--card);border-radius:28px;padding:20px 16px;box-shadow:var(--shadow);text-align:center;margin:8px 0 18px}
.prompt{font-size:28px;font-weight:600;margin:4px 0 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.say{background:#F1ECFF;border-radius:50%;width:52px;height:52px;font-size:24px;flex:0 0 auto}
.visual{font-size:44px;line-height:1.25}
.pics{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;max-width:520px;margin:0 auto}
.pics.small{font-size:30px}
.groups{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.group{border:3px dashed #D9D2F3;border-radius:16px;padding:6px 8px;font-size:28px;max-width:180px}
.eq{font-size:48px;font-weight:700;letter-spacing:2px}
.vmath{display:inline-grid;grid-template-columns:auto auto;font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;text-align:right;margin:8px auto 0;letter-spacing:4px}
.vmath .op{padding-right:18px;text-align:left;color:var(--purple)}
.vmath .ln{grid-column:1/3;border-top:6px solid var(--ink);border-radius:3px;margin:6px 0 4px}
.vmath .q{color:var(--purple)}
@media(max-width:480px){.vmath{font-size:46px}}
.bigword{font-size:56px;font-weight:700;letter-spacing:4px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{background:var(--card);border-radius:22px;min-height:96px;font-size:40px;font-weight:600;box-shadow:var(--shadow);padding:10px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.choice:active{transform:translateY(3px)}
.choice.txt{font-size:28px}
.choice svg{width:72px;height:72px}
.choice.right{background:#DCFCE7;outline:4px solid var(--green);animation:pop .35s}
.choice.wrong{background:#FEE2E2;opacity:.55;animation:shake .35s}
.pw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:24px}.pw .pe{font-size:46px;line-height:1.1}
.clock{width:190px;height:190px;margin:0 auto;display:block}
.coins{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:560px;margin:0 auto}
.coins svg{display:block}
.choice .coinpick svg{width:auto;height:auto}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* word builder */
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.slot{width:54px;height:64px;border-radius:14px;border:3px dashed #CFC6F5;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slot.f{border-style:solid;border-color:var(--green);background:#DCFCE7;animation:pop .3s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{width:68px;height:72px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:38px;font-weight:700}
.tile.used{visibility:hidden}.tile.wrong{animation:shake .35s;background:#FEE2E2}
/* memory */
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr));max-width:620px;margin:0 auto}
.mcard{aspect-ratio:1;border-radius:18px;font-size:40px;font-weight:700;box-shadow:var(--shadow);background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.mcard.open{background:var(--card);color:var(--ink);transform:scale(1.04)}
.mcard.done{background:#DCFCE7;color:var(--ink);box-shadow:none}
.mcard.t{font-size:26px}
@media(max-width:480px){.mcard{font-size:30px}.mcard.t{font-size:19px}}
/* number pop */
.arena{position:relative;height:min(60vh,520px);overflow:hidden;border-radius:28px;background:linear-gradient(#9FDCFF,#E6F6FF);box-shadow:var(--shadow);touch-action:manipulation}
.bubble{position:absolute;top:0;width:78px;height:78px;border-radius:50%;font-size:28px;font-weight:700;color:var(--ink);background:radial-gradient(circle at 30% 28%,#fff 0 14%,rgba(255,255,255,.65) 15% 40%,rgba(255,255,255,.3) 41%);border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 -6px 12px rgba(59,130,246,.25)}
.bubble.popd{animation:burst .22s forwards}.bubble.wrong{animation:shake .35s;border-color:var(--red)}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
.target{font-size:36px;font-weight:700;text-align:center;margin:6px 0 10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:20px;font-weight:600;z-index:50;animation:drop .3s;max-width:92vw;text-align:center}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.result{background:var(--card);border-radius:28px;padding:28px 18px;box-shadow:var(--shadow);text-align:center}
.bigstars{font-size:40px;letter-spacing:2px;margin:10px 0;overflow-wrap:anywhere}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.confetti{position:fixed;top:-40px;font-size:30px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(43,35,64,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:var(--card);border-radius:26px;padding:22px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.modal input,textarea.code{width:100%;font-family:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid #E5DFF7;outline:none}
.modal input{font-size:22px}
.modal input:focus,textarea.code:focus{border-color:var(--purple)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.opt{background:#F4F1FF;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:600;min-height:44px}
.opt.on{background:var(--purple);color:#fff}
.opt.av{font-size:30px;padding:6px 10px}
label.lb{display:block;font-weight:600;margin:12px 0 6px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #EEE9FB}
th{color:var(--muted);font-weight:500}
.pcard{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.note{background:#F4F1FF;border-radius:16px;padding:12px 14px;font-size:15px;color:var(--muted);margin-bottom:16px}
.story{font-size:32px;line-height:1.7;font-weight:500;max-width:640px;margin:4px auto 6px;text-align:left}
.w{cursor:pointer;border-radius:8px;padding:0 2px;transition:background .15s}
@media(hover:hover){.w:hover{background:#F1ECFF}}
.w.said{color:#15803D;background:#DCFCE7}.w.hear{background:#FDE68A}
.gate{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);text-align:center;margin-bottom:16px}
.gate .gt{font-size:22px;font-weight:600;margin-bottom:10px}
.mic{background:var(--red);color:#fff;border-radius:999px;padding:16px 26px;font-size:24px;font-weight:600;box-shadow:0 5px 0 #B91C1C}
.mic.on{background:var(--green);box-shadow:0 5px 0 #15803D;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.heard{font-size:17px;color:var(--muted);margin-top:10px;min-height:22px}
.tip{font-size:15px;color:var(--muted);margin-top:6px}
.lvbtn{background:#F1ECFF;border-radius:10px;width:36px;height:36px;font-size:18px;font-weight:700}
.badges{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.badge{background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.badge .be{font-size:48px;line-height:1.1}
.badge .bn{font-weight:600;font-size:17px;margin-top:4px}
.badge .bh{font-size:13px;color:var(--muted);margin-top:2px}
.badge.locked{background:#F1EEF8;box-shadow:none}
.badge.locked .be{filter:grayscale(1);opacity:.35}
.badge.new{outline:4px solid var(--yellow);animation:pop .5s}
.stickers{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.stk{aspect-ratio:1;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:38px;display:flex;align-items:center;justify-content:center}
.stk.off{background:#F1EEF8;box-shadow:none;color:#CFC6F5;font-size:24px}
.rank{background:var(--rank,#0EA5E9);color:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.rank .rt{font-size:26px;font-weight:700;line-height:1.2}
.bar{background:rgba(255,255,255,.3);border-radius:999px;height:16px;margin-top:10px;overflow:hidden}
.bar>div{background:var(--yellow);height:100%;border-radius:999px}
.newb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
@media(max-width:480px){
  h1{font-size:28px}.prompt{font-size:23px}.choice{font-size:34px;min-height:84px}.choice.txt{font-size:22px}
  .visual{font-size:36px}.eq{font-size:38px}.bigword{font-size:44px}.choice svg{width:60px;height:60px}.story{font-size:26px}
  .slot{width:44px;height:56px;font-size:30px}.tile{width:58px;height:64px;font-size:32px}.bubble{width:66px;height:66px;font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="tbg"></div><div id="app"></div>
<script>
{
/* ================= version + what's new (edit these when you update) ================= */
const APP_VERSION='2.4';
const WHATS_NEW=[
  {v:'2.4',items:[['🎨','Pick your own theme! Tap 🎨 Theme after you pick your name.'],['⚽','27 themes: soccer, space, dinosaurs, superheroes, pop stars, unicorns and more'],['🌟','Each theme changes the picture, colors, game icons, cheers and rank names']]},
  {v:'2.2',items:[['➕','Add & Subtract problems are stacked, like at school']]},
  {v:'2.1',items:[['🎁','A “What’s new” screen like this one'],['🔄','Grown-ups can check for updates in the Parent corner']]},
  {v:'2.0',items:[['🧱','Word Builder: spell the picture'],['🎵','Rhyme Time'],['🫧','Number Pop: pop the right bubble fast!'],['🪙','Coin Count'],['⏰','Tell the Time'],['🃏','Memory Match'],['📒','A sticker book with 60 stickers to win'],['🛠️','Fixes so games save the right way']]},
];
const verNum=v=>String(v).split('.').map(n=>parseInt(n)||0);
const newer=(a,b)=>{const x=verNum(a),y=verNum(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);}return false;};
let updateReady=null;
async function checkUpdate(){
  try{const r=await fetch('index.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return null;
    const m=(await r.text()).match(/APP_VERSION='([\d.]+)'/);updateReady=m&&newer(m[1],APP_VERSION)?m[1]:null;return updateReady;}catch(e){return null;}
}
function applyUpdate(v){try{if(window.top===window){location.replace(location.pathname+'?v='+encodeURIComponent(v||Date.now())+location.hash);return;}}catch(e){}location.reload();}

/* ================= themes ================= */
const DEF_ICONS='📖 🧱 🎵 🔤 🫧 ➕ 🔢 🪙 ⏰ 🃏 🔺 🧩 ⚖️';
const DEF_RANKS='Star Starter|Bright Beginner|Smart Sprout|Brain Builder|Super Scholar|Genius Jet|Master Mind|Learning Legend|Grand Champion|Dragon Genius';
// id|name|emoji|sky|ground|landmarks|sprinkles|dark headings|accent|tile colors|title font|coin|cheers|game icons|rank names
const THEME_ROWS=[
'classic|Classic|⭐|#FFF8EC,#FFF8EC||||0|#7C5CFF||f|⭐|||',
'soccer|Soccer|⚽|#7DD3FC,#E0F2FE|#2F9E4F,#38B05A|🥅 ⚽|⚽ 🏆|0|#16A34A|#16A34A,#0EA5E9,#F59E0B,#DC2626,#7C3AED|b|⚽|GOAL!|What a kick!|Score!|Top corner!|📖 🧱 📣 🔤 ⚽ ➕ 👕 🪙 ⏱️ 🃏 🥅 🧩 🏆|Rookie|Ball Kicker|Dribbler|Striker|Playmaker|Team Captain|All-Star|MVP|World Cup Hero|Soccer Legend',
'basketball|Basketball|🏀|#FDBA74,#FFEDD5|#C2410C,#9A3412|🏀 🏆|🏀 🥇 👟|0|#EA580C|#EA580C,#1D4ED8,#16A34A,#9333EA,#DC2626|b|🏀|Swish!|Slam dunk!|Nothing but net!|📖 🧱 📣 🔤 🏀 ➕ 👕 🪙 ⏱️ 🃏 🏟️ 🧩 🏆|Rookie|Dribbler|Shooter|Point Guard|Starter|Team Captain|All-Star|MVP|Champion|Hoops Legend',
'football|Football|🏈|#93C5FD,#DBEAFE|#2F8F4A,#1F6F36|🏈 🏟️|🏈 🏆 📣|0|#9A3412|#9A3412,#15803D,#1D4ED8,#CA8A04,#DC2626|b|🏈|Touchdown!|What a catch!|Field goal!|📖 🧱 📣 🔤 🏈 ➕ 👕 🪙 ⏱️ 🃏 🏟️ 🧩 🏆|Rookie|Kicker|Running Back|Receiver|Linebacker|Quarterback|Team Captain|All-Pro|MVP|Hall of Famer',
'baseball|Baseball|⚾|#BAE6FD,#E0F2FE|#3FA055,#C9864F|⚾ 🧢|⚾ 🥎 🏆|0|#1D4ED8|#1D4ED8,#DC2626,#15803D,#CA8A04,#7C3AED|b|⚾|Home run!|Strike!|Out of the park!|📖 🧱 📣 🔤 ⚾ ➕ 🧢 🪙 ⏱️ 🃏 🏟️ 🧩 🏆|Rookie|Bat Kid|Pitcher|Catcher|Slugger|Home Run Hitter|All-Star|MVP|World Series Hero|Baseball Legend',
'space|Outer Space|🚀|#0B1033,#3B2A7A|#6B7280,#374151|🚀 🪐|🛸 ⭐ 🌙 ☄️ 👽|1|#7C3AED|#7C3AED,#0EA5E9,#DB2777,#F59E0B,#10B981|o|⭐|Blast off!|Out of this world!|Rocket power!|📡 🧱 🎵 🔤 🛸 ➕ 🌟 🪙 ⏰ 🃏 🪐 🧩 ☄️|Space Cadet|Star Gazer|Moon Walker|Rocket Rider|Planet Hopper|Comet Chaser|Star Captain|Galaxy Guardian|Space Commander|Cosmic Legend',

const LKEY='klg-v2';
const DEF_SET={lastTheme:'classic',readAloud:true,voiceStyle:'kid',voiceName:'',speed:'slow',readFirst:true};
const S={settings:{...DEF_SET},players:[]};
const AVATARS=['🦁','🐯','🐻','🐼','🦊','🐸','🦄','🐵','🐶','🐱','🐧','🦖','🚀','⚽'];
function cleanP(p){
  if(!p||typeof p!=='object'||typeof p.id!=='string'||typeof p.name!=='string')return null;
  const q=JSON.parse(JSON.stringify(p));
  q.name=q.name.slice(0,16);q.age=Math.min(13,Math.max(3,parseInt(q.age)||6));
  if(!AVATARS.includes(q.avatar))q.avatar='🦁';
  if(typeof q.theme!=='string')q.theme='classic';
  q.games=q.games&&typeof q.games==='object'?q.games:{};
  q.stickers=Array.isArray(q.stickers)?q.stickers.filter(s=>typeof s==='string'):[];
  q.days=Array.isArray(q.days)?q.days.filter(s=>typeof s==='string'):[];
  return q;
}
function cleanSet(s){const o={...DEF_SET};if(s&&typeof s==='object'){for(const k in DEF_SET)if(typeof s[k]===typeof DEF_SET[k])o[k]=s[k];}return o;}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LKEY)||'null');if(s){S.players=(s.players||[]).map(cleanP).filter(Boolean);S.settings=cleanSet(s.settings);}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S));}catch(e){}}
loadLocal();

let cloud=null,sync='local';
const pending=new Map(),inflight=new Set();let flushT=null;
function setSync(s){sync=s;const el=document.getElementById('sync');if(el)el.outerHTML=syncPill();}
function syncPill(){
  const m={cloud:['ok','☁️ Saved to your account'],saving:['ok','☁️ Saving…'],connecting:['','☁️ Connecting…'],slow:['warn','☁️ Can’t reach the cloud yet'],local:['warn','📱 Saved on this device only']}[sync]||['',''];
  return `<span class="pill sync ${m[0]}" id="sync">${m[1]}</span>`;
}
function queue(id,data){saveLocal();if(!cloud)return;pending.set(id,data);clearTimeout(flushT);flushT=setTimeout(flush,700);}
async function flush(){
  if(!cloud)return;
  for(const [id,data] of [...pending]){
    if(inflight.has(id))continue;pending.delete(id);inflight.add(id);setSync('saving');
    try{const ref=cloud.col.doc(id);if(data===null)await ref.delete();else await ref.set(JSON.parse(JSON.stringify(data)));}
    catch(e){const c=e&&e.code;
      if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){cloud=null;pending.clear();setSync('local');inflight.delete(id);return;}
      if(!pending.has(id))pending.set(id,data);}
    inflight.delete(id);
  }
  if(pending.size){clearTimeout(flushT);flushT=setTimeout(flush,1500);}else setSync('cloud');
}
const savePlayer=p=>{const i=S.players.findIndex(x=>x.id===p.id);if(i>=0)S.players[i]=p;queue('p_'+p.id,p);};
const saveSettings=()=>queue('settings',S.settings);
const removePlayer=id=>{S.players=S.players.filter(p=>p.id!==id);queue('p_'+id,null);};
function applyCloud(snap){
  const keep=new Map(S.players.map(p=>[p.id,p]));let players=[];
  snap.docs.forEach(d=>{
    if(pending.has(d.id)||inflight.has(d.id)){if(d.id!=='settings'){const lp=keep.get(d.id.slice(2));if(lp)players.push(lp);}return;}
    const data=d.data();
    if(d.id==='settings')S.settings=cleanSet(data);
    else if(d.id.startsWith('p_')){const p=cleanP(data);if(p)players.push(p);}
  });
  for(const [id,v] of pending){if(id.startsWith('p_')&&v&&!players.some(p=>p.id===v.id))players.push(v);}
  players.sort((a,b)=>a.id<b.id?-1:1);S.players=players;saveLocal();
  if(['home','menu','parents','rewards'].includes(view)&&!document.querySelector('.modal-bg')){
    if(view==='home')renderHome();else if(view==='parents')renderParents();
    else if(getPlayer(viewPlayer))(view==='menu'?renderMenu:renderRewards)(viewPlayer);else renderHome();
  }
}
async function connect(){
  try{
    if(!window.claude||typeof claude.use!=='function'){setSync('local');return;}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user&&await user.id();
    if(!db||!uid){setSync('local');return;}
    const col=db.collection('data/users/'+uid);
    setSync('connecting');let ready=false;
    const t=setTimeout(()=>{if(!ready)setSync('slow');},10000);
    col.onSnapshot(snap=>{
      if(snap.metadata.fromCache&&!ready)return;
      if(!ready){ready=true;clearTimeout(t);cloud={db,col};
        if(snap.empty&&S.players.length){S.players.forEach(p=>queue('p_'+p.id,p));saveSettings();flush();return;}
        setSync('cloud');}
      applyCloud(snap);
    },e=>{clearTimeout(t);cloud=null;setSync('local');});
  }catch(e){setSync('local');}
}

const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function numChoices(ans,count=4,spread=3,min=0,fmt=String){
  const s=new Set([ans]);let t=0;
  while(s.size<count&&t<300){t++;const v=ans+rint(-spread,spread);if(v>=min)s.add(v);}
  let v=ans+1;while(s.size<count)s.add(v++);
  return shuffle([...s]).map(v=>({html:fmt(v),value:String(v),say:String(v)}));
}

function beep(good){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();

  setTheme(p.theme);hush();cur={run:++runId,p,g,s,level:s.level,startLevel:s.level,idx:0,stars:0,right:0,answered:0,marks:[],streakR:0,streakW:0,done:false};
  if(g.kind==='memory')return startMemory();
  if(g.kind==='pop')return startPop();
  nextQ();
}
function quitRound(){hush();try{if(listening&&dict)dict.stop().catch(()=>{});}catch(e){}
  if(cur&&!cur.done){cur.pop=null;commitRound(false);}renderMenu(cur?cur.p.id:viewPlayer);}
function commitRound(full){
  const {p,s}=cur;cur.done=true;
  s.level=cur.level;s.maxLevel=Math.max(s.maxLevel||1,cur.level,cur.startLevel);
  s.stars+=cur.stars;s.right+=cur.right;s.total+=cur.answered;
  cur.newStickers=[];

  const mic=$('#mic');if(mic)mic.onclick=()=>{

    hush();g.final='';g.partial='';
    try{dict.start().catch(err=>{const c=String(err&&(err.code||err.message||err));if(!/dismissed|no-speech|aborted|busy/.test(c))dictDenied=true;listening=false;gateUI();});}catch(e){dictDenied=true;gateUI();}};

function gateMicUI(){const m=$('#mic');if(!m)return;m.classList.toggle('on',listening);m.textContent=listening?'👂 Listening… tap when done':'🎤 Tap and read';}
function gateHeard(text,final){

/* ================= Memory Match ================= */
function memPairs(L,n){
  const out=[];
  if(L<=2){shuffle(STICKERS).slice(0,n).forEach((e,i)=>out.push([{f:e,k:i},{f:e,k:i}]));}
  else if(L===3){shuffle(ABC).slice(0,n).forEach((l,i)=>out.push([{f:l,k:i,say:l,t:1},{f:l.toLowerCase(),k:i,say:l,t:1}]));}
  else if(L===4){const seen=new Set();while(out.length<n){const a=rint(1,9),b=rint(1,9);if(seen.has(a+b))continue;seen.add(a+b);out.push([{f:`${a}+${b}`,k:a+b,say:`${a} plus ${b}`,t:1},{f:String(a+b),k:a+b,say:String(a+b),t:1}]);}}
  else{const all=shuffle([...BUILD[0],...BUILD[1]]).slice(0,n);all.forEach(([w,e],i)=>out.push([{f:w,k:i,say:w,t:1},{f:e,k:i,say:w}]));}
  return shuffle(out.flat());
}
function startMemory(){
  const pairs=[3,4,6,8,10][cur.level-1];
  cur.mem={cards:memPairs(cur.level,pairs).map((c,i)=>({...c,i,open:false,done:false})),open:[],pairs,found:0,miss:0,busy:false};
  renderMemory();speak('Find the matching pairs!');
}
function renderMemory(){
  view='play';const M=cur.mem;
  $('#app').innerHTML=`<div class="topbar"><button class="btn ghost small" id="quit" aria-label="Stop game">✕</button>
    <span class="pill" style="box-shadow:none;background:#F1ECFF">${gIcon(cur.g)} Memory Match · Level ${cur.level}</span><span class="pill" id="mstat">✅ ${M.found} of ${M.pairs}</span></div>
    <p class="sub" style="text-align:center">${cur.level===3?'Match the BIG letter with its little letter.':cur.level===4?'Match the math fact with its answer.':cur.level===5?'Match the word with its picture.':'Flip two cards. Find the ones that match!'}</p>
    <div class="mgrid" id="mg" style="grid-template-columns:repeat(${M.cards.length<=6?3:M.cards.length===20?5:4},minmax(0,1fr))">${M.cards.map(c=>`<button class="mcard${c.t?' t':''}" data-i="${c.i}" aria-label="card">❓</button>`).join('')}</div>`;
  $('#quit').onclick=quitRound;
  document.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>memTap(+b.dataset.i,b));
}
function memTap(i,b){
  const M=cur.mem,c=M.cards[i];if(M.busy||c.open||c.done)return;
  c.open=true;b.classList.add('open');b.textContent=c.f;if(c.say)speak(c.say);M.open.push(c);
  if(M.open.length<2)return;
  const [a,d]=M.open;M.open=[];
  const el=x=>document.querySelector(`.mcard[data-i="${x.i}"]`);
  if(a.k===d.k){a.done=d.done=true;M.found++;beep(true);later(()=>{el(a).classList.add('done');el(d).classList.add('done');$('#mstat').textContent=`✅ ${M.found} of ${M.pairs}`;
      if(M.found===M.pairs)memEnd();else speak(praise());},350);}
  else{M.miss++;M.busy=true;later(()=>{[a,d].forEach(x=>{x.open=false;const e=el(x);e.classList.remove('open');e.textContent='❓';});M.busy=false;},1000);}
}
function memEnd(){
  const M=cur.mem,free=Math.floor(M.pairs/2);
  cur.stars=Math.max(3,ROUND-Math.max(0,M.miss-free));cur.right=M.pairs;cur.answered=M.pairs+M.miss;

/* ================= Number Pop ================= */
function popTarget(L){
  let a,b;
  if(L===1){a=rint(1,10);return {show:String(a),say:`Pop the number ${a}`,ans:a};}
  if(L===2){a=rint(1,9);b=rint(1,10-a);return {show:`${a} + ${b}`,say:`Pop ${a} plus ${b}`,ans:a+b};}
  if(L===3){if(Math.random()<.5){a=rint(2,12);b=rint(1,20-a);return {show:`${a} + ${b}`,say:`Pop ${a} plus ${b}`,ans:a+b};}a=rint(5,20);b=rint(1,a);return {show:`${a} − ${b}`,say:`Pop ${a} minus ${b}`,ans:a-b};}
  if(L===4){a=pick([2,3,5,10]);b=rint(1,10);return {show:`${a} × ${b}`,say:`Pop ${a} times ${b}`,ans:a*b};}
  if(Math.random()<.65){a=rint(2,10);b=rint(2,10);return {show:`${a} × ${b}`,say:`Pop ${a} times ${b}`,ans:a*b};}
  b=rint(2,10);const c=rint(2,10);return {show:`${b*c} ÷ ${b}`,say:`Pop ${b*c} divided by ${b}`,ans:c};
}
function startPop(){
  const P={score:0,miss:0,left:45,bubbles:[],next:0,target:null,last:0};cur.pop=P;view='play';
  $('#app').innerHTML=`<div class="topbar"><button class="btn ghost small" id="quit" aria-label="Stop game">✕</button>
    <span class="pill" id="ptime">⏱️ 45</span><span class="pill" id="pscore">🫧 0</span></div>
    <div class="target" id="ptarget"></div><div class="arena" id="arena"></div>
    <p class="tip" style="text-align:center">Level ${cur.level} · ${LEVEL_NOTES.pop[cur.level-1]} · tap the bubble with the answer!</p>`;
  $('#quit').onclick=quitRound;popNew();
  requestAnimationFrame(t=>{P.last=t;P.next=t;P.end=t+45000;requestAnimationFrame(popTick);});
}
function popNew(){const P=cur.pop;let t;do{t=popTarget(cur.level);}while(P.target&&t.show===P.target.show);P.target=t;
  $('#ptarget').innerHTML=`Pop: <span style="color:#0284C7">${t.show}</span> <button class="say" id="psay" aria-label="Hear it" style="vertical-align:middle">🔊</button>`;
  $('#psay').onclick=()=>speak(t.say,true);speak(t.say);}
function popTick(t){
  const P=cur&&cur.pop;if(!P||cur.done)return;
  const ar=$('#arena');if(!ar)return;const H=ar.clientHeight,dt=Math.min(.05,(t-P.last)/1000);P.last=t;
  const left=Math.max(0,Math.ceil((P.end-t)/1000));if(left!==P.left){P.left=left;$('#ptime').textContent='⏱️ '+left;}
  if(t>=P.end)return popEnd();
  if(t>=P.next){P.next=t+[1000,900,850,800,750][cur.level-1];
    const hasAns=P.bubbles.some(b=>b.v===P.target.ans&&b.y>H*.25);
    let v=P.target.ans;if(hasAns&&Math.random()<.85){let tries=0;do{v=Math.max(0,P.target.ans+rint(-6,6));}while(v===P.target.ans&&tries++<20);if(v===P.target.ans)v=P.target.ans+7;}
    const el=document.createElement('button');el.className='bubble';el.textContent=v;el.style.left=rint(2,78)+'%';
    const b={v,y:H+10,sp:55+cur.level*10+rint(0,30),el};el.style.transform=`translateY(${b.y}px)`;
    el.onclick=()=>popTap(b);ar.appendChild(el);P.bubbles.push(b);}
  P.bubbles=P.bubbles.filter(b=>{if(b.gone)return false;b.y-=b.sp*dt;if(b.y<-90){b.el.remove();return false;}b.el.style.transform=`translateY(${b.y}px)`;return true;});
  requestAnimationFrame(popTick);
}
function popTap(b){
  const P=cur&&cur.pop;if(!P||b.gone)return;
  if(b.v===P.target.ans){b.gone=true;b.el.classList.add('popd');setTimeout(()=>b.el.remove(),230);beep(true);P.score++;$('#pscore').textContent='🫧 '+P.score;popNew();}

function popEnd(){

    return `<div class="pcard"><div class="topbar"><h2 style="margin:0">${esc(p.avatar)} ${esc(p.name)} <span style="color:var(--muted);font-size:18px">age ${p.age}</span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" data-th="${esc(p.id)}">🎨 Theme: ${themeOf(p.theme).name}</button><button class="btn danger small" data-del="${esc(p.id)}">Remove</button></div></div>
      <div style="overflow-x:auto"><table><tr><th>Game</th><th>Level</th><th>Stars</th><th>First try</th></tr>${rows}</table></div></div>`;}).join(''):'<p class="sub">No players yet.</p>';
  const vs=enVoices();
  $('#app').innerHTML=`
    <div class="topbar"><button class="btn ghost small" id="back">← Back</button>${readToggle()}</div>
    <h1>👪 Parent corner</h1>
    <div class="pcard"><h2 style="margin:0 0 6px">☁️ Saving</h2>${syncPill()}
      <div class="tip">When you open this game while signed in to Claude, players, stars and stickers save to your Claude account. They show up the same on your phone, iPad and laptop. If it says “this device only,” sign in to Claude in that browser. You can also use a backup code below.</div>
      <div class="row" style="justify-content:flex-start"><button class="btn small ghost" id="bk">📋 Copy backup code</button><button class="btn small ghost" id="rs">📥 Restore from code</button></div>
      <div id="bkbox"></div></div>
    <div class="pcard"><h2 style="margin:0 0 6px">🔄 Updates</h2>
      <div>You have version <b>${APP_VERSION}</b>.</div>
      <div class="row" style="justify-content:flex-start"><button class="btn small" id="chk">Check for updates</button><button class="btn small ghost" id="wn">🎁 What’s new</button></div>
      <div class="tip" id="chkmsg"></div></div>
    <div class="pcard"><h2 style="margin:0 0 6px">🔊 Voice</h2>
      <div class="opts" id="vstyle"><button class="opt${S.settings.voiceStyle!=='adult'?' on':''}" data-s="kid">🧒 Kid voice</button><button class="opt${S.settings.voiceStyle==='adult'?' on':''}" data-s="adult">🧑 Grown-up voice</button></div>
      ${vs.length?`<label class="lb" for="vname">Which voice</label><select id="vname" style="width:100%;font-family:inherit;font-size:17px;padding:10px;border-radius:12px;border:3px solid #E5DFF7;background:#fff;min-height:44px">
        <option value="">Automatic</option>${vs.map(v=>`<option value="${esc(v.name)}"${v.name===S.settings.voiceName?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`:''}
      <label class="lb">Speed</label>
      <div class="opts" id="vspeed">${[['xslow','🐢 Extra slow'],['slow','🐌 Slow'],['normal','🐇 Normal']].map(([k,l])=>`<button class="opt${S.settings.speed===k?' on':''}" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="row" style="justify-content:flex-start"><button class="btn small" id="vtest">▶ Test voice</button></div></div>
    <div class="pcard"><h2 style="margin:0 0 6px">🎤 Read out loud first</h2>
      <div class="opts" id="rfirst"><button class="opt${S.settings.readFirst?' on':''}" data-v="1">On</button><button class="opt${!S.settings.readFirst?' on':''}" data-v="0">Off</button></div>
      <div class="tip">In Read &amp; Tap, the answers stay hidden until your child reads the sentence out loud. The game listens when the app allows the microphone. Otherwise a grown-up taps 👍.</div></div>
    <div class="note">Use − and + to set a level by hand. Each kid starts at a level based on age. Then the game adjusts: 3 right in a row moves up, 2 misses in a row moves down. A star only counts on the first try. Every finished game with 3+ stars wins a sticker (a perfect game wins 2).</div>
    ${blocks}`;
  $('#back').onclick=renderHome;bindToggle();
  $('#wn').onclick=()=>showWhatsNew(true);
  $('#chk').onclick=async()=>{const m=$('#chkmsg');m.textContent='Checking…';const v=await checkUpdate();
    if(v){m.innerHTML=`Version ${esc(v)} is ready. <button class="btn small" id="getu" style="margin-top:8px">Update now</button>`;$('#getu').onclick=()=>applyUpdate(v);}
    else m.textContent='You have the newest version. If you just uploaded a change, wait a minute and check again.';};
  $('#bk').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $('#bkbox').innerHTML=`<label class="lb" for="bkt">Backup code (keep it in your Notes app)</label><textarea class="code" id="bkt" rows="3" readonly>${esc(code)}</textarea>`;
    const t=$('#bkt');t.select();try{navigator.clipboard.writeText(code).then(()=>toast('Backup code copied'),()=>{});}catch(e){}};
  $('#rs').onclick=()=>{$('#bkbox').innerHTML=`<label class="lb" for="rst">Paste a backup code</label><textarea class="code" id="rst" rows="3"></textarea><div class="row" style="justify-content:flex-start"><button class="btn small" id="rsgo">Restore</button></div><div class="tip">This replaces the players here with the ones in the code.</div>`;
    $('#rsgo').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#rst').value.trim()))));const ps=(d.players||[]).map(cleanP).filter(Boolean);if(!ps.length)throw 0;
        S.players.forEach(p=>{if(!ps.some(x=>x.id===p.id))queue('p_'+p.id,null);});S.players=ps;S.settings=cleanSet(d.settings);ps.forEach(p=>queue('p_'+p.id,p));saveSettings();toast('Restored!');renderParents();}
      catch(e){toast('That code didn’t work. Check it was copied in full.');}};};
  document.querySelectorAll('#vstyle .opt').forEach(b=>b.onclick=()=>{S.settings.voiceStyle=b.dataset.s;saveSettings();document.querySelectorAll('#vstyle .opt').forEach(x=>x.classList.toggle('on',x===b));speak('Hi! Let’s learn and have fun!',true);});
  const vn=$('#vname');if(vn)vn.onchange=e=>{S.settings.voiceName=e.target.value;saveSettings();voice=null;pickVoice();speak('Hi! Let’s learn and have fun!',true);};
  $('#vtest').onclick=()=>speak('Hi! Let’s learn and have fun!',true);
  document.querySelectorAll('#vspeed .opt').forEach(b=>b.onclick=()=>{S.settings.speed=b.dataset.k;saveSettings();document.querySelectorAll('#vspeed .opt').forEach(x=>x.classList.toggle('on',x===b));speak('I put on my shoes to go out.',true);});
  document.querySelectorAll('#rfirst .opt').forEach(b=>b.onclick=()=>{S.settings.readFirst=b.dataset.v==='1';saveSettings();document.querySelectorAll('#rfirst .opt').forEach(x=>x.classList.toggle('on',x===b));});
  document.querySelectorAll('.lvbtn').forEach(b=>b.onclick=()=>{const p=getPlayer(b.dataset.p);if(!p)return;const s=gstat(p,b.dataset.g);s.level=Math.min(5,Math.max(1,s.level+(+b.dataset.d)));s.maxLevel=Math.max(s.maxLevel,s.level);savePlayer(p);renderParents();});
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>themeModal(b.dataset.th,renderParents));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){removePlayer(b.dataset.del);renderParents();}
    else{b.dataset.armed='1';b.textContent='Tap again to remove';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Remove';}},3000);}});
}

/* tap a word anywhere to hear it */
let tapSaveT=null;
document.addEventListener('click',e=>{const w=e.target.closest&&e.target.closest('.w');if(!w||!w.dataset.w)return;
  speak(w.dataset.w,true);w.classList.add('hear');setTimeout(()=>w.classList.remove('hear'),700);
  if(view==='play'&&cur&&cur.p){cur.p.taps=(cur.p.taps||0)+1;const p=cur.p;clearTimeout(tapSaveT);tapSaveT=setTimeout(()=>savePlayer(p),2000);}});

/* what's new pop-up: shows once per version on this device */
function showWhatsNew(force){
  let seen='';try{seen=localStorage.getItem('klg-seen')||'';}catch(e){}
  if(!force&&seen===APP_VERSION)return;
  try{localStorage.setItem('klg-seen',APP_VERSION);}catch(e){}
  const list=force||!seen?WHATS_NEW.slice(0,1):WHATS_NEW.filter(w=>newer(w.v,seen)).slice(0,3);if(!list.length)return;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" style="text-align:center"><div style="font-size:64px">🎁</div><h2 style="margin:0">What’s new!</h2><p class="sub" style="margin:4px 0 12px">Version ${APP_VERSION}</p>
    <div style="text-align:left">${list.map(w=>w.items.map(([e,t])=>`<div style="display:flex;gap:12px;align-items:center;font-size:19px;padding:8px 0;border-bottom:1px solid #EEE9FB"><span style="font-size:34px;flex:0 0 44px;text-align:center">${e}</span><span>${esc(t)}</span></div>`).join('')).join('')}</div>
    <div class="row"><button class="btn" id="wnok">Let’s play! 🚀</button></div></div>`;
  document.body.appendChild(bg);confetti();
  bg.querySelector('#wnok').onclick=()=>{bg.remove();speak('Let’s play!');};
}

renderHome();
showWhatsNew(false);
connect();
checkUpdate().then(v=>{if(v&&view==='home'&&!document.querySelector('.modal-bg'))renderHome();});
try{if(window.claude&&typeof claude.use==='function'){
  claude.use('dictation').then(d=>attachDict(d)).catch(()=>{});
  if(!canSpeak())claude.use('tts').then(t=>{tts=t;}).catch(()=>{});
}}catch(e){}
window.__klg={THEMES,GAMES,genBuild,genTime,genMoney,genRhyme,memPairs,popTarget};
}
</script>
</body>
</html>
